services:
  search-featured-results-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      # The test suite connects to mongo directly to seed Result fixtures, so these
      # must match the app service's values below.
      DB_HOST: mongodb
      DB_DATABASE: featured-tests
    depends_on:
      - search-featured-results
  search-featured-results:
    build: .
    read_only: true
    environment:
      DB_HOST: mongodb
      DB_DATABASE: featured-tests
      JWT_TRUSTED_ISSUERS: '[{ "iss": "unified-auth", "url": "http://fakeauth/jwks" }]'
      ORIGIN: http://search-featured-results
      PUBLIC_BASE_URL: http://search-featured-results
      PUBLIC_AUTH_BASE_URL: http://fakeauth
    depends_on:
      - mongodb
      - fakeauth
  mongodb:
    image: mongo:7
    command: --logpath /dev/null
  fakeauth:
    image: registry.its.txstate.edu/unified-auth-stub:dev
